# IjaraGo — nginx
#
# Bitta domen:
#   /        -> statik fayllar (public/)
#   /api/    -> PocketBase API      (127.0.0.1:8091)
#   /_/      -> PocketBase admin UI (127.0.0.1:8091)
#
# Avval DuckDNS'da ijarago.duckdns.org ni server IP'siga yo'naltiring, keyin:
#   certbot --nginx -d ijarago.duckdns.org      (SSL qatorlarini o'zi qo'shadi)

# API'ga so'rovlar chastotasini cheklash (spam va qo'pol hujumlardan himoya).
# sites-enabled fayllari http{} ichiga qo'shiladi, shuning uchun bu yerda yozish to'g'ri.
limit_req_zone $binary_remote_addr zone=ijarago_api:10m rate=10r/s;

server {
    listen 80;
    server_name ijarago.duckdns.org;

    root /root/projects/ijarago/public;
    index index.html;

    # --- Statik sayt ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html keshlanmasin — yangi deploy darhol ko'rinsin
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # CSS/JS/rasm — qisqa kesh (fayl nomlarida versiya yo'q)
    location ~* \.(css|js|png|jpg|jpeg|svg|webp|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public";
    }

    # --- PocketBase API ---
    location /api/ {
        limit_req zone=ijarago_api burst=30 nodelay;

        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;          # realtime (WebSocket)
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        client_max_body_size 32M;                         # 6 ta rasm x 5 MB uchun zaxira bilan
    }

    # --- PocketBase admin paneli ---
    # Faqat o'zingiz kirishingiz uchun IP bilan cheklash tavsiya etiladi:
    #   allow <SIZNING_IP>;
    #   deny  all;
    location /_/ {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
